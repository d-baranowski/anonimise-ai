# Pattern recognisers for both languages. Names, places and organisations come from the NER model
# configured in nlp.yaml, not from here.
supported_languages:
  - en
  - pl
global_regex_flags: 26

recognizers:
  - name: EmailRecognizer
    supported_languages: [en, pl]
    type: predefined

  - name: IbanRecognizer
    supported_languages: [en, pl]
    type: predefined

  - name: CreditCardRecognizer
    supported_languages: [en, pl]
    type: predefined

  - name: UrlRecognizer
    supported_languages: [en, pl]
    type: predefined

  - name: PhoneRecognizer
    supported_languages: [en]
    type: predefined

  - name: PlPeselRecognizer
    supported_languages: [pl]
    type: predefined

  # Presidio's PhoneRecognizer does not include the PL region by default; a plain pattern is
  # easier to read in a POC than tuning libphonenumber.
  - name: PlPhoneRecognizer
    type: custom
    supported_language: pl
    supported_entity: PHONE_NUMBER
    patterns:
      - name: pl_phone
        regex: "(?<!\\d)(?:\\+48[ -]?)?\\d{3}[ -]?\\d{3}[ -]?\\d{3}(?!\\d)"
        score: 0.6
    context: [tel, telefon, numer, komórka, komorka]

  # Customer and therapist initials in a therapy code such as JN-MK-MON: the first two parts are
  # people, the last one is the day. Case-sensitive on purpose, (?-i:...) inside Presidio's
  # case-insensitive matching, or every hyphenated word would qualify.
  - name: TherapyCodeInitialsRecognizer
    type: custom
    supported_language: pl
    supported_entity: PERSON
    patterns:
      - name: customer_initials
        regex: "(?-i:\\b[A-ZĄĆĘŁŃÓŚŹŻ]{2,3}(?=-[A-ZĄĆĘŁŃÓŚŹŻ]{2,3}-[A-Z]{2,4}\\b))"
        score: 0.7
      - name: therapist_initials
        regex: "(?-i:(?<=\\b[A-ZĄĆĘŁŃÓŚŹŻ]{2}-)[A-ZĄĆĘŁŃÓŚŹŻ]{2,3}(?=-[A-Z]{2,4}\\b))"
        score: 0.7

