model_list:
  # Records what it receives; nothing leaves the machine.
  - model_name: fake
    litellm_params:
      model: openai/fake-model
      api_base: http://fake-llm:4010/v1
      api_key: not-needed

  # A real provider, reached through the recording tap so the UI can show what Anthropic got.
  # Only used when ANTHROPIC_API_KEY is set in .env.
  - model_name: claude
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      api_base: http://fake-llm:4010/anthropic

guardrails:
  # Presidio finds the PII; linked_presidio.py gives each person one placeholder number, with a
  # suffix per written form, so the reply can be restored exactly. On for every request: a caller
  # cannot forget it.
  - guardrail_name: presidio-linked
    litellm_params:
      guardrail: linked_presidio.LinkedPresidio
      mode: pre_call
      default_on: true
      output_parse_pii: true
      presidio_language: pl

general_settings:
  master_key: sk-poc-local

litellm_settings:
  set_verbose: false
