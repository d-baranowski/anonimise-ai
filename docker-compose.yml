name: pii-proxy-poc

services:
  presidio-analyzer:
    build: ./analyzer
    image: pii-poc-analyzer:local
    ports: ["5002:3000"]

  presidio-anonymizer:
    image: ghcr.io/data-privacy-stack/presidio-anonymizer:2.2.364
    ports: ["5001:3000"]

  fake-llm:
    image: node:22.20.0-alpine
    command: ["node", "/app/server.mjs"]
    volumes: ["./fake-llm:/app:ro"]
    ports: ["4010:4010"]

  litellm:
    image: ghcr.io/berriai/litellm:v1.103.2
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes: ["./litellm/config.yaml:/app/config.yaml:ro"]
    environment:
      PRESIDIO_ANALYZER_API_BASE: http://presidio-analyzer:3000
      PRESIDIO_ANONYMIZER_API_BASE: http://presidio-anonymizer:3000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["4000:4000"]
    depends_on: [presidio-analyzer, presidio-anonymizer, fake-llm]

  webui:
    image: node:22.20.0-alpine
    command: ["node", "/app/webui/server.mjs"]
    volumes:
      - ./webui:/app/webui:ro
      - ./samples.json:/app/samples.json:ro
      - ./litellm/config.yaml:/app/litellm/config.yaml:ro
    environment:
      ANALYZER_URL: http://presidio-analyzer:3000
      PROXY_URL: http://litellm:4000
      TAP_URL: http://fake-llm:4010
    ports: ["4020:4020"]
    depends_on: [litellm]

